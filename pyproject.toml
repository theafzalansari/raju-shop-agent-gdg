[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raju-shop-agent-gdg"
version = "0.1.0"
description = "Raju's Royal Artifacts - ADK Agent API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.6.2",
    "google-genai>=2.17.0",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "pydantic>=2.13.0",
    "pytest>=9.1.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "app.fast_api_app:app"
